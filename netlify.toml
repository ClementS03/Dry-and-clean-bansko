# /hotels a ete renomme /business. Ces URLs sont indexees depuis juillet
# et ont servi en prospection, elles doivent continuer a resoudre.
[[redirects]]
  from = "/hotels"
  to = "/business"
  status = 301

[[redirects]]
  from = "/en/hotels"
  to = "/en/business"
  status = 301

[[redirects]]
  from = "/ru/hotels"
  to = "/ru/business"
  status = 301

[[redirects]]
  from = "https://www.wetdrycleaningbansko.com/*"
  to = "https://wetdrycleaningbansko.com/:splat"
  status = 301
  force = true

# ── Caching headers ─────────────────────────────────────────────
# Next.js build assets are content-hashed → safe to cache forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Next.js optimized images (on-demand) — long cache, revalidate via hash.
[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static raster/vector assets shipped in /public.
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Security + perf headers for every document.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; upgrade-insecure-requests"
